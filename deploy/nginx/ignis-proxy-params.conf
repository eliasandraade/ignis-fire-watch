# Same-origin API proxy (included per location by /tmp/ignis/api-proxy.conf).
# A variable in proxy_pass forwards the original request URI unchanged.
proxy_pass $ignis_api;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# Railway's edge overwrites X-Real-IP with the client address; nginx forwards
# that value (not its own peer, which is the edge) so the API's per-IP rate
# limit keeps working (CLIENT_IP_HEADER=x-real-ip).
proxy_set_header X-Real-IP $http_x_real_ip;
proxy_set_header X-Forwarded-For $http_x_real_ip;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
# The API has no upload endpoints; JSON bodies are small.
client_max_body_size 1m;
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
# The API's own responses (including its 503 from /ready) pass through as they
# are; only when nginx cannot reach the API at all does it answer, in JSON.
proxy_intercept_errors off;
error_page 502 504 = @ignis_api_unavailable;
