name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalação reproduzível
        run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - name: Vitest + cobertura
        # A failing test fails this check.
        run: npm run test:coverage
      - name: Build de produção (modo API)
        env:
          VITE_USE_API: "true"
          VITE_API_URL: https://api.invalid
        run: npm run build
      - name: Build de produção (modo demonstrativo)
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: coverage/lcov.info
          retention-days: 14

  dependencies:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependências de runtime (falha com high/critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Relatório completo (inclui dev; informativo)
        run: npm audit || true

  sonarcloud:
    name: SonarQube Cloud (cobertura)
    needs: quality
    # Opt-in: requires a SonarQube Cloud project for this repository, the
    # SONAR_TOKEN secret and the repository variable SONAR_CI_ANALYSIS=true.
    if: vars.SONAR_CI_ANALYSIS == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: coverage
      - uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
